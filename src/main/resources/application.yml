server:
  # 本地默认 11800；Vercel 容器会注入 $PORT
  port: ${PORT:11800}

spring:
  application:
    name: papergen-server
  datasource:
    driver-class-name: org.postgresql.Driver
    # 本地 PostgreSQL 16，库名 papergen；部署时通过 DB_URL 等环境变量覆盖
    url: ${DB_URL:jdbc:postgresql://localhost:5432/papergen}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: papergen-hikari
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      max-lifetime: 1800000
  jackson:
    default-property-inclusion: non_null

# MyBatis Plus 配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.papergen.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    com.papergen: debug
    org.springframework: warn
