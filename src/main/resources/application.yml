server:
  # Vercel 容器会注入 $PORT，本地不设时回落到 11800
  port: ${PORT:11800}

spring:
  application:
    name: papergen-server
  datasource:
    driver-class-name: org.postgresql.Driver
    # 本地默认连 localhost；线上通过 DB_URL / DB_USERNAME / DB_PASSWORD 覆盖
    url: ${DB_URL:jdbc:postgresql://localhost:5432/papergen?stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
    hikari:
      pool-name: papergen-hikari
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      max-lifetime: 1800000
  jackson:
    default-property-inclusion: non_null
  ai:
    # 模型由后端按此配置动态构建，关闭 starter 内聊天/向量模型的自动装配
    openai:
      # 给空默认值，未配 key 时应用仍能启动，调用 AI 时才提示
      api-key: ${ZHIPU_API_KEY:}
      # base-url 与 completions-path 拼接后必须正好是 /api/paas/v4/chat/completions
      base-url: https://api.z.ai
      completions-path: /api/paas/v4/chat/completions
      model: ${ZHIPU_MODEL:glm-4.7-flash}
      temperature: ${ZHIPU_TEMPERATURE:0.7}
    model:
      chat: none
      embedding: none
  servlet:
    multipart:
      # 试卷导入文件大小限制
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis Plus 配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.papergen.generate.domain.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# 认证与验证码
papergen:
  jwt:
    secret: ${PAPERGEN_JWT_SECRET:papergen-local-dev-secret-change-me-2026}
    issuer: papergen
    # 令牌有效期（分钟），默认 7 天
    expire-minutes: 10080
    # 前端保存 JWT 的 Cookie 名称
    cookie-name: papergen_token
  captcha:
    # 验证码有效期（秒）
    expire-seconds: 120
    # 滑块允许误差（像素）
    tolerance: 5

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    com.papergen: debug
    org.springframework: warn
